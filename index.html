@keyframes kb{to{transform:scale(1.15) translate(-2%,-2%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#030a16 100%);pointer-events:none}
#wp{position:fixed;top:0;bottom:0;width:30vw;left:-40vw;background:linear-gradient(90deg,transparent,rgba(240,185,74,.55),transparent);pointer-events:none;z-index:5}
#wp.go{animation:wipe .8s ease-in}@keyframes wipe{to{left:110vw}}
#seg{display:flex;gap:4px;padding:8px 12px;z-index:3}#seg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer}#seg i.d{background:var(--gold)}#seg i.a{background:linear-gradient(90deg,var(--gold) 50%,rgba(255,255,255,.18) 50%);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.5}}
#stage{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:2vh 6vw;max-width:1150px;margin:0 auto;width:100%;overflow-y:auto;animation:in .8s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:scale(1.05);filter:blur(12px)}}
.k{color:var(--gold);letter-spacing:.3em;font-size:clamp(11px,1.8vw,15px);text-transform:uppercase;font-weight:700}
h1{font-size:clamp(26px,5.6vw,54px);line-height:1.08;margin:.15em 0 .45em;text-transform:uppercase;font-weight:800;text-shadow:0 4px 30px rgba(74,163,255,.5)}
h1:after{content:"";display:block;height:4px;width:0;margin-top:10px;background:linear-gradient(90deg,var(--gold),transparent);animation:ul 1.2s .5s forwards}@keyframes ul{to{width:min(320px,60%)}}
.r{opacity:0;transform:translateY(28px) scale(.97);animation:up .7s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--d)*.4s + .15s)}
@keyframes up{to{opacity:1;transform:none}}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.c{background:var(--glass);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--cc,var(--gold));border-radius:14px;padding:14px 16px;font-size:clamp(14px,2.2vw,19px);line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.c b{display:block;color:var(--cc,var(--gold));margin-bottom:5px;text-transform:uppercase;font-size:.82em;letter-spacing:.1em}
.ic{font-size:2em;display:block;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.logo{width:min(46vw,300px);animation:lg 1.6s cubic-bezier(.2,.9,.2,1) both,glow 3s 1.6s ease-in-out infinite alternate}
@keyframes lg{from{opacity:0;transform:scale(.2) rotate(-120deg)}}@keyframes glow{to{filter:drop-shadow(0 0 28px rgba(74,163,255,.9))}}
.ctr{text-align:center;display:flex;flex-direction:column;align-items:center}
.ltr{display:inline-block;opacity:0;animation:lt .6s forwards;animation-delay:calc(var(--i)*.05s + 1s)}@keyframes lt{from{transform:translateY(30px) rotateX(90deg)}to{opacity:1;transform:none}}
.stamp{border:5px solid var(--red);color:var(--red);padding:10px 18px;font-weight:800;font-size:clamp(20px,5vw,40px);transform:rotate(-7deg);display:inline-block;text-transform:uppercase;animation:st .5s 1.4s cubic-bezier(.3,1.6,.5,1) both;border-radius:8px}
@keyframes st{from{opacity:0;transform:rotate(-7deg) scale(4)}}
.num{font-size:2.2em;font-weight:800;color:var(--gold);line-height:1}
.lane{position:relative;height:84px;border-radius:12px;background:#17233a;overflow:hidden;margin:8px 0;border:1px solid rgba(255,255,255,.1)}
.lane:before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--lc);background:var(--ln)}
.car{transform:scaleX(-1);position:absolute;left:12%;top:6px;font-size:34px;animation:var(--an) 4s ease-in-out infinite}
@keyframes cross{0%,15%{top:6px}45%,60%{top:46px}90%,100%{top:6px}}
@keyframes bump{0%,20%{top:6px}40%{top:26px}55%,100%{top:6px}}
@keyframes hes{0%,20%{top:6px}60%{top:40px}100%{top:6px}}
.lane.mv:before{background-size:40px 100%;animation:ml .4s linear infinite}@keyframes ml{to{background-position:-40px 0}}.tag{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:clamp(11px,2vw,16px);background:rgba(0,0,0,.5);padding:4px 10px;border-radius:20px}
.run{animation:run 5s linear infinite}@keyframes run{from{left:-14%}to{left:104%}}
.siren{animation:sir .6s infinite alternate}@keyframes sir{from{box-shadow:0 0 30px var(--red)}to{box-shadow:0 0 30px var(--blue)}}
.tl i{display:block;width:34px;height:34px;border-radius:50%;margin:6px;animation:bu 6s infinite;opacity:.15}@keyframes bu{0%,30%{opacity:1;box-shadow:0 0 22px currentColor}33%,100%{opacity:.15}}
#cap{position:relative;z-index:3;text-align:center;padding:6px 5vw;min-height:48px;font-size:clamp(13px,2.1vw,18px);line-height:1.4;color:#7f93b3}#cap span.on{color:#fff}#cap span.cur{color:var(--gold);font-weight:700}
.ctl{position:relative;z-index:3;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
button{background:var(--gold);color:#10203c;border:0;border-radius:24px;padding:10px 18px;font:700 15px "Josefin Sans",system-ui,sans-serif;cursor:pointer;transition:transform .15s}button:active{transform:scale(.92)}
button.s{background:rgba(255,255,255,.12);color:var(--tx)}#cnt{color:var(--mut);font-size:14px;min-width:50px;text-align:center}
#start{position:fixed;inset:0;z-index:9;background:radial-gradient(circle,#12305c,#050d1c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
#start img{width:min(40vw,220px);animation:glow 2s infinite alternate}#start h1{margin:0}#start h1:after{margin:10px auto 0}

const r=(d,h,c="")=>`<div class="r ${c}" style="--d:${d}">${h}</div>`;
const card=(d,i,t,b,cc="")=>`<div class="c r" style="--d:${d};${cc?`--cc:${cc}`:""}"><span class="ic" style="animation-delay:${d*.3}s">${i}</span><b>${t}</b>${b}</div>`;

const park=(t,ok,body)=>`<div class="c r" style="--cc:${ok?"var(--grn)":"var(--red)"}"><svg viewBox="0 0 200 110" width="100%"><rect width="200" height="30" fill="#8a97ab"/><rect y="30" width="200" height="4" fill="#cfd8e8"/><rect y="34" width="200" height="76" fill="#1b2840"/>${body}</svg><b>${t}</b></div>`;
const S=[
{n:"Welcome to the T P N P Transportation Office orientation. This briefing covers the rules every vehicle operator must know, inside and outside the camp.",
h:()=>`<div class="ctr"><img class="logo" src="${LOGO}" alt="">${r(0,"","")}<h1 style="margin-top:20px">${[..."TPNP Transportation Office"].map((c,i)=>`<span class="ltr" style="--i:${i}">${c===" "?"&nbsp;":c}</span>`).join("")}</h1><div class="k r" style="--d:6;font-size:clamp(18px,4vw,30px)">Orientation</div></div>`},
{n:"Here is what we will cover: the office’s mission, the types of license, vehicle guidelines, road signs and speed limits, road markings, parking, and finally the punishments for violations.",
h:()=>hd("Agenda","Table of contents")+grid(["Introduction","Information","Types of license","Vehicle guidelines","Road signs & speed limits","Road markings","Proper parking","Punishments"].map((t,i)=>`<div class="c r" style="--d:${i*.5+2}"><span class="num">0${i+1}</span><br>${t}</div>`))},
{n:"Our mission is to regulate and discipline all vehicle operators through strict traffic codes and proper licensing. Our vision is a professional driving culture with zero violations. And our goal is to guide every license taker on driving regulations and parking protocols.",
h:()=>hd("Section 1","Introduction")+grid([card(2,"🎯","Mission","Regulate and discipline all vehicle operators by enforcing strict traffic codes and proper licensing.","var(--blue)"),card(4,"👁️","Vision","A highly disciplined, professional driving culture. A zero-violation environment.","var(--gold)"),card(6,"🏁","Goals","Guide every license taker on driving and parking protocols. Keep strict lane discipline.","var(--grn)")])},
{n:"This orientation guides all vehicle operators of every division. It serves as the official regulation inside and outside the map. Please remember: these slides are for this group only, and must not be copied or shared.",
h:()=>hd("Section 2","Information")+grid([card(2,"🧭","Purpose","Guide all vehicle operators of every division under the TPNP.","var(--blue)"),card(4,"📘","Scope","Basic driving and parking knowledge. Official regulation inside and outside the map.","var(--gold)")])+`<div style="margin-top:22px" class="ctr"><span class="stamp">Confidential · This group only</span></div>`},
{n:"There are two license types. Type A allows two-wheeled vehicles only. Type B allows four-wheeled vehicles exclusively. Both can only be acquired by licensed personnel.",
h:()=>hd("Section 3","Types of license")+grid([`<div class="c r" style="--d:2;overflow:hidden"><b>Type A · 2 wheels</b>Licensed personnel only. Two-wheeled vehicles.<div class="lane mv" style="--ln:repeating-linear-gradient(90deg,#fff 0 20px,transparent 20px 40px)"><span class="car run" style="--an:none;top:24px">🏍️</span></div></div>`,`<div class="c r" style="--d:3;overflow:hidden;--cc:var(--blue)"><b>Type B · 4 wheels</b>Licensed personnel only. Four-wheeled vehicles exclusively.<div class="lane mv" style="--ln:repeating-linear-gradient(90deg,#fff 0 20px,transparent 20px 40px)"><span class="car run" style="--an:none;top:24px;animation-duration:4s">🚓</span></div></div>`])},
{n:"Guideline one: every U V I P and P F member must have their license issued by this office. Guideline two: no divisionless personnel or civilians in your vehicle. Other authorized divisions may ride along only for patrol and emergencies. Guideline three: never abandon a vehicle. Drive it to the nearest void. Guideline four: do not drive on the concrete of the parade deck.",
h:()=>hd("Section 4","Vehicle guidelines 1–4")+grid([card(2,"🪪","No. 1","All UVIP and PF members must get their license from the Transportation Office."),card(4,"🚷","No. 2","No divisionless personnel or civilians aboard. Other authorized divisions only for patrol and emergencies.","var(--red)"),card(6,"🕳️","No. 3","Never abandon a vehicle. To dispose of it, drive to the nearest void.","var(--blue)"),card(8,"🏛️","No. 4","Do not drive on the concrete of the parade deck.","var(--red)")])},
{n:"Guideline five: always use your indicators. Guideline six: no emergency vehicle lights while patrolling inside the camp. Outside the camp only, except for authorized events, car chases and emergencies. Guideline seven: the siren is for emergencies only.",
h:()=>hd("Section 4","Vehicle guidelines 5–7")+grid([card(2,"🔶","No. 5","Use your indicators at all times.","var(--gold)"),card(4,"🚨","No. 6","No emergency lights inside the camp. Outside only, except authorized events, car chases and emergencies.","var(--red)"),card(6,"📢","No. 7","Never use the siren without purpose. Emergencies only.","var(--blue)")])},
{n:"Follow every road sign you see. Traffic lights use red, yellow and green to keep vehicles and pedestrians safe. For Type A and B vehicles, the minimum speed is fifteen kilometers per hour, and the maximum is forty to forty-five. Exceeding it may result in a citation or apprehension.",

{n:"A double solid yellow line means you must not cross or overtake. Stay in your lane. A broken white line means you may change lanes or overtake, only if it is safe. A solid white line means lane changing is discouraged, but not completely prohibited.",

{n:"Violations are punished in tiers. The first tier brings a violator’s ticket, a database log, and three minutes of jail after three violations. The second tier adds a report to your division, a two day driving blacklist, five minutes of jail, and disciplinary training. At maximum strikes, the C P S O issues a warrant of arrest, you are reported to Internal Affairs, and you are blacklisted from driving.",

let i=0,voice=true,playing=false,tok=0,tm;const $=id=>document.getElementById(id);
$("seg").innerHTML=S.map((_,k)=>`<i data-k="${k}"></i>`).join("");$("seg").onclick=e=>{if(e.target.dataset.k)show(+e.target.dataset.k)};
function stop(){tok++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(n){stop();i=Math.max(0,Math.min(S.length-1,n));const st=$("stage"),w=$("wp");st.style.animation="none";st.offsetHeight;st.style.animation="";st.innerHTML=S[i].h();w.classList.remove("go");w.offsetHeight;w.classList.add("go");
$("cnt").textContent=(i+1)+" / "+S.length;[...$("seg").children].forEach((e,k)=>e.className=k<i?"d":k==i?"a":"");
const W=[...S[i].n.matchAll(/\S+/g)];$("cap").innerHTML=W.map(m=>`<span>${m[0]}</span>`).join(" ");$("cap").W=W;if(playing)speak()}
function next(){if(i<S.length-1)show(i+1);else{playing=false;$("pl").textContent="↻";[...$("seg").children].forEach(e=>e.className="d")}}
function mark(c){const W=$("cap").W,sp=$("cap").children;let k=0;W.forEach((m,j)=>{if(m.index<=c)k=j});[...sp].forEach((s,j)=>s.className=j<k?"on":j==k?"cur":"")}
function best(){const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));return v.find(v=>/natural|neural|online/i.test(v.name))||v.find(v=>/google|samantha|daniel|aaron|karen|jenny|aria/i.test(v.name))||v[0]}
function speak(){const my=++tok,s=S[i],done=()=>{if(my===tok&&playing)tm=setTimeout(next,1000)};
if(voice&&"speechSynthesis" in window){try{const u=new SpeechSynthesisUtterance(s.n);u.rate=.93;u.pitch=.95;const v=best();if(v)u.voice=v;u.onboundary=e=>{if(my===tok)mark(e.charIndex)};u.onend=()=>{mark(1e9);done()};u.onerror=done;speechSynthesis.speak(u);return}catch(e){}}
tm=setTimeout(done,Math.max(7000,s.n.length*70))}
function begin(v){voice=v;$("mu").textContent=v?"🔊":"🔇";$("start").style.display="none";playing=true;$("pl").textContent="❚❚";show(0)}
$("go").onclick=()=>begin(true);$("go2").onclick=()=>begin(false);
$("pl").onclick=()=>{if(!playing){const re=$("pl").textContent==="↻";playing=true;$("pl").textContent="❚❚";show(re?0:i)}else{playing=false;stop();$("pl").textContent="▶"}};
$("nx").onclick=()=>show(i+1);$("pv").onclick=()=>show(i-1);$("mu").onclick=()=>{voice=!voice;$("mu").textContent=voice?"🔊":"🔇";show(i)};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1);if(e.key===" ")$("pl").click()});
const cv=$("fx"),x=cv.getContext("2d");let P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let k=0;k<50;k++)P.push({x:Math.random(),y:Math.random(),s:Math.random()*2+.5,v:Math.random()*.0007+.0002,c:k%4?"74,163,255":"240,185,74"});
(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=1;x.fillStyle=`rgba(${p.c},.6)`;x.beginPath();x.arc(p.x*cv.width,p.y*cv.height,p.s,0,7);x.fill()});requestAnimationFrame(f)})();
try{speechSynthesis.getVoices()}catch(e){}
